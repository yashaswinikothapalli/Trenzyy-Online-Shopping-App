{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Trenzyy App</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#0f172a,#1e3a8a,#7c3aed);
            overflow:hidden;
            position:relative;
        }

        /* Background Glow */

        body::before{
            content:'';
            position:absolute;
            width:350px;
            height:350px;
            background:#06b6d4;
            border-radius:50%;
            filter:blur(120px);
            top:-100px;
            left:-100px;
            opacity:0.5;
        }

        body::after{
            content:'';
            position:absolute;
            width:350px;
            height:350px;
            background:#9333ea;
            border-radius:50%;
            filter:blur(120px);
            bottom:-100px;
            right:-100px;
            opacity:0.5;
        }

        /* Login Card */

        .login-container{
            width:400px;
            padding:40px;
            border-radius:28px;
            background:rgba(255,255,255,0.12);
            backdrop-filter:blur(18px);
            border:1px solid rgba(255,255,255,0.2);
            box-shadow:0 10px 40px rgba(0,0,0,0.3);
            color:white;
            position:relative;
            z-index:10;
            animation:fadeIn 0.8s ease;
        }

        @keyframes fadeIn{
            from{
                opacity:0;
                transform:translateY(20px);
            }
            to{
                opacity:1;
                transform:translateY(0);
            }
        }

        .logo{
            text-align:center;
            margin-bottom:25px;
        }

        .logo h1{
            font-size:34px;
            font-weight:800;
            letter-spacing:1px;
        }

        .logo p{
            color:#d1d5db;
            margin-top:8px;
            font-size:15px;
        }

        .input-group{
            margin-bottom:22px;
        }

        .input-group label{
            display:block;
            margin-bottom:8px;
            font-size:15px;
            font-weight:600;
        }

        .input-box{
            position:relative;
        }

        .input-box i{
            position:absolute;
            top:50%;
            left:15px;
            transform:translateY(-50%);
            color:#cbd5e1;
        }

        .input-box input{
            width:100%;
            padding:14px 14px 14px 45px;
            border:none;
            outline:none;
            border-radius:14px;
            background:rgba(255,255,255,0.15);
            color:white;
            font-size:15px;
            transition:0.3s;
        }

        .input-box input::placeholder{
            color:#d1d5db;
        }

        .input-box input:focus{
            background:rgba(255,255,255,0.22);
            box-shadow:0 0 12px rgba(255,255,255,0.25);
        }

        .login-btn{
            width:100%;
            padding:14px;
            border:none;
            border-radius:16px;
            background:linear-gradient(135deg,#06b6d4,#8b5cf6);
            color:white;
            font-size:17px;
            font-weight:700;
            cursor:pointer;
            transition:0.3s;
            margin-top:10px;
        }

        .login-btn:hover{
            transform:translateY(-3px) scale(1.02);
            box-shadow:0 10px 25px rgba(0,0,0,0.25);
        }

        .bottom-text{
            text-align:center;
            margin-top:22px;
            color:#d1d5db;
            font-size:14px;
        }

        .bottom-text a{
            color:#fff;
            text-decoration:none;
            font-weight:700;
        }

        .bottom-text a:hover{
            text-decoration:underline;
        }

        @media(max-width:450px){

            .login-container{
                width:90%;
                padding:30px;
            }

            .logo h1{
                font-size:28px;
            }
        }

    </style>
</head>

<body>

    <div class="login-container">

        <div class="logo">
            <h1>🛍 Trenzyy App</h1>
            <p>Login to continue shopping 🌐🛒</p>
        </div>

        <form method="POST">

            {% csrf_token %}

            <div class="input-group">
                <label>Username :</label>

                <div class="input-box">
                    <i class="fa fa-user"></i>

                    <input type="text"
                           name="username"
                           placeholder="Enter username"
                           required>
                </div>
            </div>

            <div class="input-group">
                <label>Password :</label>

                <div class="input-box">
                    <i class="fa fa-lock"></i>

                    <input type="password"
                           name="password"
                           placeholder="Enter password"
                           required>
                </div>
            </div>

            <button type="submit" class="login-btn">
                <i class="fa fa-right-to-bracket"></i>
                Login
            </button>

        </form>

        <div class="bottom-text">
            Welcome back ✨⚡🛍️
        </div>

    </div>

</body>
</html>
